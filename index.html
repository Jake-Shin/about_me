<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>뮤지컬 동선 애니메이션</title>
<style>
  body { margin:0; background:#f8f8f8; font-family:sans-serif; }
  #stage {
    position:relative; width:900px; height:600px; margin:20px auto;
    background:#fff; border:2px solid #444; overflow:hidden;
  }
  .jury   { position:absolute; width:18px; height:18px; background:#333;
            border-radius:50%; transform:translate(-50%,-50%); }
  .actor  { position:absolute; width:22px; height:22px; border-radius:50%;
            transform:translate(-50%,-50%); transition: none; }
  .red    { background:#e74c3c; }
  .blue   { background:#3498db; }
  .green  { background:#2ecc71; }
  .purple { background:#9b59b6; }
  #controls { text-align:center; margin:10px; }
  #timer { font-weight:bold; }
</style>
</head>
<body>

<div id="stage"></div>
<div id="controls">
  <button id="play">▶ 재생</button>
  <button id="pause">❚❚ 일시정지</button>
  <span id="timer">00:00</span>
</div>

<script>
/* ---------- 1. 배심원(검정) 위치 ---------- */
const juryPos = [
  // 왼쪽 4열
  {x:120,y:150}, {x:120,y:210}, {x:120,y:270}, {x:120,y:330},
  {x:180,y:150}, {x:180,y:210}, {x:180,y:270}, {x:180,y:330},
  {x:240,y:150}, {x:240,y:210}, {x:240,y:270}, {x:240,y:330},
  // 오른쪽 4열
  {x:660,y:150}, {x:660,y:210}, {x:660,y:270}, {x:660,y:330},
  {x:720,y:150}, {x:720,y:210}, {x:720,y:270}, {x:720,y:330},
  {x:780,y:150}, {x:780,y:210}, {x:780,y:270}, {x:780,y:330}
];
juryPos.forEach(p => {
  const el = document.createElement('div');
  el.className = 'jury';
  el.style.left = p.x + 'px';
  el.style.top  = p.y + 'px';
  document.getElementById('stage').appendChild(el);
});

/* ---------- 2. 변호인(색) 객체 ---------- */
class Actor {
  constructor(color, id) {
    this.el = document.createElement('div');
    this.el.className = `actor ${color}`;
    this.el.textContent = id;
    this.el.style.color = '#fff';
    this.el.style.fontSize = '12px';
    this.el.style.lineHeight = '22px';
    this.el.style.textAlign = 'center';
    document.getElementById('stage').appendChild(this.el);
    this.path = [];               // [{t:초, x:px, y:px}, ...]
  }
  setPos(x,y){ this.el.style.left=x+'px'; this.el.style.top=y+'px'; }
}

/* ---------- 3. 동선 데이터 (이미지에서 추출) ---------- */
// t = 분:초 → 초 단위 변환, 1초당 1분 재생
const paths = {
  red: [                                   // 변호인1 (빨강)
    {t:0,   x:450,y:520}, {t:5,   x:450,y:460},
    {t:15,  x:380,y:380}, {t:30,  x:300,y:300},
    {t:50,  x:250,y:250}, {t:70,  x:250,y:180},
    {t:90,  x:350,y:180}, {t:110, x:450,y:180},
    {t:130, x:550,y:180}, {t:150, x:650,y:250},
    {t:170, x:650,y:350}, {t:190, x:550,y:420},
    {t:210, x:450,y:520}
  ],
  blue: [                                  // 변호인2 (파랑)
    {t:0,   x:450,y:560}, {t:10,  x:450,y:480},
    {t:25,  x:500,y:400}, {t:40,  x:580,y:340},
    {t:60,  x:650,y:300}, {t:80,  x:720,y:300},
    {t:100, x:720,y:400}, {t:120, x:650,y:460},
    {t:140, x:550,y:500}, {t:160, x:450,y:560}
  ],
  green: [                                 // 변호인3 (초록)
    {t:0,   x:430,y:540}, {t:12,  x:430,y:460},
    {t:30,  x:380,y:380}, {t:48,  x:330,y:320},
    {t:68,  x:300,y:260}, {t:88,  x:300,y:180},
    {t:108, x:400,y:180}, {t:128, x:500,y:180},
    {t:148, x:600,y:260}, {t:168, x:630,y:340},
    {t:188, x:580,y:420}, {t:208, x:430,y:540}
  ],
  purple: [                                // 변호인4 (보라)
    {t:0,   x:470,y:540}, {t:8,   x:470,y:460},
    {t:22,  x:520,y:380}, {t:38,  x:580,y:320},
    {t:58,  x:650,y:280}, {t:78,  x:720,y:280},
    {t:98,  x:720,y:380}, {t:118, x:650,y:440},
    {t:138, x:550,y:480}, {t:158, x:470,y:540}
  ]
};

/* ---------- 4. Actor 생성 ---------- */
const actors = {
  red:    new Actor('red',    '1'),
  blue:   new Actor('blue',   '2'),
  green:  new Actor('green',  '3'),
  purple: new Actor('purple', '4')
};
Object.keys(paths).forEach(col => actors[col].path = paths[col]);

/* ---------- 5. 애니메이션 엔진 ---------- */
let startTime = null, paused = true, pauseOffset = 0;
const totalSec = 302;   // 05:02 = 302초
const timerEl = document.getElementById('timer');

function format(t){
  const m = Math.floor(t/60).toString().padStart(2,'0');
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function interpolate(path, sec){
  if (sec <= path[0].t) return path[0];
  for(let i=0;i<path.length-1;i++){
    const a = path[i], b = path[i+1];
    if (sec >= a.t && sec <= b.t){
      const r = (sec - a.t)/(b.t - a.t);
      return {x: a.x + (b.x-a.x)*r, y: a.y + (b.y-a.y)*r};
    }
  }
  return path[path.length-1];
}

function animate(now){
  if (!startTime) startTime = now;
  if (paused) { requestAnimationFrame(animate); return; }

  const elapsed = (now - startTime)/1000 + pauseOffset;   // 실제 재생 초
  if (elapsed >= totalSec){
    pauseOffset = 0; startTime = now;   // 루프
  }
  const sec = elapsed % totalSec;
  timerEl.textContent = format(sec);

  // 각 변호인 위치 갱신
  Object.keys(actors).forEach(col=>{
    const pos = interpolate(actors[col].path, sec);
    actors[col].setPos(pos.x, pos.y);
  });

  requestAnimationFrame(animate);
}

/* ---------- 6. 컨트롤 ---------- */
document.getElementById('play').onclick = () => {
  if (paused && pauseOffset===0) { startTime = performance.now(); }
  paused = false;
};
document.getElementById('pause').onclick = () => {
  paused = true;
  pauseOffset = (performance.now() - startTime)/1000 + pauseOffset;
  startTime = null;
};

requestAnimationFrame(animate);
</script>
</body>
</html>
